<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Floor</title>
<style>
:root{
  --bg:#0e0f11; --panel:#16181c; --panel-2:#1c1f24; --line:#282c33;
  --ink:#e6e8ea; --ink-2:#a2a8b0; --ink-3:#6c737d;
  --live:#4ade80; --warn:#f5b955; --dead:#ef6b6b; --idle:#3a3f47;
  --accent:#8ab4f8;
  --r:12px; --gap:14px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:20px 16px 56px;
}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:600}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;gap:var(--gap);align-items:center;
  justify-content:space-between;margin-bottom:18px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;
  border:1px solid var(--line);border-radius:999px;background:var(--panel);
  font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.on{background:var(--live);box-shadow:0 0 0 0 rgba(74,222,128,.6);
  animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}
                100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.clock{text-align:right}
.clock .t{font-size:26px;font-weight:600;letter-spacing:.02em}
.clock .t:not(.mono-on){font-size:26px}
.clock .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase}

/* ---------- source picker ---------- */
.sources{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.src{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
  min-width:132px;transition:border-color .2s,background .2s;text-align:left;
  font:inherit;color:inherit}
.src:hover{border-color:#3a414b}
.src[aria-selected="true"]{border-color:var(--accent);background:var(--panel-2)}
.src .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.src .c{font-size:11.5px;color:var(--ink-3)}
.src[aria-selected="true"] .t{color:var(--accent)}
.pill{width:7px;height:7px;border-radius:50%;flex:none}
.pill.ready{background:var(--live)}
.pill.needs-input{background:var(--warn)}
.pill.blocked{background:var(--dead)}

.srcHead{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:var(--gap);display:flex;gap:18px;
  flex-wrap:wrap;align-items:center;justify-content:space-between}
.srcHead .who{display:flex;flex-direction:column;gap:3px;min-width:200px}
.srcHead .who b{font-size:16px}
.srcHead .who span{font-size:12.5px;color:var(--ink-3)}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:1px}
.stat b{font-size:20px;font-weight:600;letter-spacing:.01em}
.stat span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
/* Green is a thing that got THROUGH, red is a thing that stopped. Zero is
   never coloured - a green 0 reads as a success and it is the absence of one. */
.stat.good b{color:var(--live)} .stat.bad b{color:var(--dead)}
.stat.warn b{color:var(--warn)} .stat.zero b{color:var(--ink-3)}
td.good{color:var(--live)} td.bad{color:var(--dead)} td.warn{color:var(--warn)}
.station .v.good{color:var(--live)} .station .v.zero{color:var(--ink-3)}
.warnbox{width:100%;font-size:12.5px;color:var(--warn);border-left:2px solid var(--warn);
  padding-left:11px;line-height:1.5}
@media (max-width:560px){
  .stats{gap:18px} .stat b{font-size:17px}
  .src{flex:1 1 calc(50% - 8px);min-width:0}
}

/* ---------- the line ---------- */
.line{display:grid;gap:10px;margin-bottom:var(--gap);
  grid-template-columns:repeat(7,1fr)}
.station{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;min-height:118px;display:flex;flex-direction:column;gap:6px;
  position:relative;overflow:hidden;transition:border-color .25s,background .25s}
.station .n{font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.station .nm{font-weight:600;font-size:13px;text-transform:capitalize}
.station .d{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.station .v{margin-top:auto;font-size:19px;font-weight:600;letter-spacing:.01em}
.station.active{border-color:var(--live);background:var(--panel-2)}
.station.active .n,.station.active .nm{color:var(--live)}
.station.done{border-color:#2f4738}
.bar{position:absolute;left:0;bottom:0;height:2px;background:var(--live);
  width:0;transition:width .4s ease}

/* ---------- the idea drill-down ---------- */
tr.idea{cursor:pointer}
tr.idea:hover td{background:#1b1e23}
tr.idea td:first-child::before{content:'▸';color:var(--ink-3);margin-right:8px;
  display:inline-block;transition:transform .15s}
tr.idea.open td:first-child::before{transform:rotate(90deg)}
tr.detail>td{padding:0;border-bottom:1px solid var(--line)}
.det{padding:14px 16px;background:#131519}
.det h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.det h3:not(:first-child){margin-top:18px}
.det table{margin-bottom:2px}
.det .why{font-size:12px;color:var(--ink-2);line-height:1.5;margin:0 0 12px;
  border-left:2px solid var(--line);padding-left:11px}
.pass{color:var(--live)} .fail{color:var(--dead)}
.flagdot{color:var(--warn)}

/* ---------- panels ---------- */
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(12,1fr);
  align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.c4{grid-column:span 4} .c5{grid-column:span 5} .c6{grid-column:span 6}
.c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}

.now{display:flex;flex-direction:column;gap:4px}
.now .big{font-size:17px;font-weight:600}
.now .sub{font-size:12.5px;color:var(--ink-2);word-break:break-word}

/* funnel */
.fun{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:104px 1fr 48px;gap:10px;align-items:center}
.frow .k{font-size:12px;color:var(--ink-2)}
.frow .t{height:9px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.frow .t i{display:block;height:100%;background:linear-gradient(90deg,#4b5563,#8ab4f8);
  border-radius:5px;transition:width .5s ease}
.frow .v{text-align:right;font-weight:600;font-size:13px}

/* gates */
.gates{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--panel-2)}
.gates i{display:block;height:100%;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 14px;font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.sw{width:9px;height:9px;border-radius:2px;flex:none}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--ink-3);padding:5px 8px 7px;
  border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #1e2126;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.wide{white-space:normal;word-break:break-word;min-width:170px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;
  border:1px solid var(--line);color:var(--ink-2);letter-spacing:.04em}
.tag.agent{border-color:#3d5573;color:var(--accent)}
.tag.invent{border-color:#4a4133;color:var(--warn)}
.tag.tradingview{border-color:#2f4738;color:var(--live)}
.ok{color:var(--live)} .bad{color:var(--dead)} .mid{color:var(--warn)}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.verdict{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--ink-2);
  border-left:2px solid var(--line);padding-left:11px}
.lede{margin:-4px 0 12px;font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.means{margin-top:5px;font-size:11.5px;line-height:1.55;color:var(--ink-3);
  max-width:66ch;white-space:normal}
.empty{color:var(--ink-3);font-size:12.5px;padding:8px 0}
footer{margin-top:22px;font-size:11.5px;color:var(--ink-3);text-align:center}

@media (max-width:980px){
  .line{grid-template-columns:repeat(4,1fr)}
  .c4,.c5,.c6,.c7,.c8{grid-column:span 12}
}
@media (max-width:560px){
  body{padding:14px 12px 40px}
  .line{grid-template-columns:repeat(2,1fr)}
  .station{min-height:98px}
  .clock{text-align:left}
  .frow{grid-template-columns:88px 1fr 40px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <h1>Factory Floor</h1>
    <span class="badge"><i class="dot" id="dot"></i><span id="status">checking</span></span>
    <span class="badge dim" id="passes">—</span>
  </div>
  <div class="clock">
    <div class="t mono" id="uptime">—</div>
    <div class="l dim" id="uptimeLabel">running without interruption</div>
  </div>
</header>

<div class="sources" id="sources"></div>

<div class="srcHead" id="srcHead"></div>

<div class="line" id="line"></div>

<div class="grid">

  <div class="card c5">
    <h2>Happening now</h2>
    <div class="now">
      <div class="big" id="nowStep">—</div>
      <div class="sub" id="nowDetail"></div>
      <div class="sub mono dim" id="nowIdea"></div>
      <div class="sub mono dim" id="nowAge"></div>
    </div>
  </div>

  <div class="card c7">
    <h2>Funnel</h2>
    <div class="fun" id="funnel"></div>
  </div>

  <div class="card c7" id="gatesCard">
    <h2>Why ideas died</h2>
    <p class="lede" id="gatesLede"></p>
    <div class="gates" id="gates"></div>
    <div class="legend" id="gatesLegend"></div>
    <div class="scroll"><table id="gatesTable"></table></div>
    <div class="verdict" id="gatesNote"></div>
  </div>

  <div class="card c5" id="nullCard">
    <h2>Luck check</h2>
    <div id="null"></div>
  </div>

  <div class="card c12" id="ideasCard">
    <h2>Strategies tested · 2023–2026</h2>
    <p class="lede">Best market and timeframe. Click a row for detail.</p>
    <div class="scroll"><table id="ideas"></table></div>
  </div>

  <div class="card c12" id="gapsCard">
    <h2>Could not translate</h2>
    <div class="scroll"><table id="gapsTable"></table></div>
    
  </div>

  <div class="card c12">
    <h2>Sources</h2>
    <div class="scroll"><table id="srcTable"></table></div>
    <div class="verdict" id="sourceNote"></div>
  </div>

</div>

<footer>polls <span class="mono">/api/state</span> every 2s · nothing here starts a run</footer>
</div>

<script>
const $ = id => document.getElementById(id);
// Keyed "<step>:<gate>". The SAME gate at two steps is two different
// findings: "never traded enough" versus "traded enough recently but not on
// the older window", and reporting the second as the first told Kris his
// script fell apart when its edge had never been measured there at all.
// PLAIN ENGLISH, and it is not decoration. Kris, 2026-09-23: *"what it says
// is 'lost money on the years it was not selected on', i dont understand what
// it means."* Every reason is a sentence someone who did not build the
// pipeline can act on, with the jargon - holdout, selected on, drift control -
// spelled out rather than named.  [step, the reason, what it means]
const STOP_WHY = {
  '3:trades':        ['step 3', 'Too few trades', ''],
  '3:cost':          ['step 3', 'Loses after fees', ''],
  '3:concentration': ['step 3', 'Profit from a few lucky trades', ''],
  '3:drift':         ['step 3', 'Random entries did better', ''],
  '3:other':         ['step 3', 'No usable trades', ''],
  '6:trades':        ['step 6', 'Too few trades on older years', ''],
  '6:cost':          ['step 6', 'Lost money on older years', ''],
  '6:concentration': ['step 6', 'Older years: profit from a few trades', ''],
  '6:drift':         ['step 6', 'Older years: random did better', ''],
  '6:other':         ['step 6', 'No older data', ''],
  scored: ['step 7', 'Passed everything', ''],
  alive:  ['-', 'Passed step 3, waiting', ''],
  other:  ['-', 'No usable trades', ''],
};
const STOP_COL = k => ({'3':'#8ab4f8','6':'#e879a0'}[String(k).split(':')[0]]
                        || (k === 'scored' ? '#4ade80' : '#4b5563'));
let S = null, tick = 0;
// Which source the page is looking at. Kris, 2026-09-23: the source is the
// thing you pick first, so it is remembered between reloads.
let SRC = (() => { try { return localStorage.getItem('factory.src') || ''; }
                   catch(e) { return ''; } })();
const pick = k => {
  SRC = k;
  try { localStorage.setItem('factory.src', k); } catch(e) {}
  paint();
};
const row = () => (S.sources || []).find(r => r.key === SRC) || null;

function dur(s){
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
        m = Math.floor(s%3600/60), x = s%60;
  const p = n => String(n).padStart(2,'0');
  return d ? `${d}d ${p(h)}:${p(m)}:${p(x)}` : `${p(h)}:${p(m)}:${p(x)}`;
}
const esc = t => String(t ?? '').replace(/[<>&]/g, c =>
  ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function sourceBar(){
  const rows = S.sources || [];
  if (!rows.some(r => r.key === SRC)) SRC = rows.length ? rows[0].key : '';
  $('sources').innerHTML = rows.map(r =>
    `<button class="src" role="tab" aria-selected="${r.key===SRC}" data-k="${esc(r.key)}">
       <span class="t"><i class="pill ${esc(r.status)}"></i>${esc(r.label)}</span>
       <span class="c">${r.read} read · ${r.found} usable</span>
     </button>`).join('');
  $('sources').querySelectorAll('.src').forEach(b =>
    b.onclick = () => pick(b.dataset.k));

  const r = row();
  if (!r){ $('srcHead').innerHTML = ''; return; }
  // Zero is never green and never red: it is the absence of an outcome, not
  // an outcome. Kris reads this bar at a glance and a coloured nothing lies.
  const stat = (v,l,tone) =>
    `<div class="stat ${v ? (tone||'') : 'zero'}"><b class="mono">${v}</b>
       <span>${l}</span></div>`;
  // A source with nothing against it must say WHY, or "0 found" reads as
  // "this source found nothing" when it means "this source has not been run".
  const warn = (r.found === 0 && r.status !== 'ready')
    ? `<div class="warnbox">${esc(r.note)}</div>` : '';
  $('srcHead').innerHTML =
    `<div class="who"><b>${esc(r.label)}</b><span>${esc(r.how)}</span></div>
     <div class="stats">
       ${stat(r.read,'read')}${stat(r.found,'usable','good')}
       ${r.refused ? stat(r.refused,'refused','warn') : ''}
       ${stat(r.tested,'tested')}${stat(r.passed3,'passed step 3','good')}
       ${stat(r.failed,'failed','bad')}${stat(r.held6,'held at 6','good')}
       ${stat(r.scored7,'scored at 7','good')}${stat(r.waiting,'waiting','warn')}
     </div>${warn}`;
}

function stations(){
  const b = S.beat, cur = S.live ? b.step : 0;
  const r = row();
  // EVERY STATION IS ABOUT THE SELECTED SOURCE. They used to read the live
  // beat and the global funnel, so switching to a source with nothing tested
  // still showed another source's counts on the line.
  const f = r ? r.funnel : {ideas:0, step3_pass:0, step4_repaired:0, step6_pass:0, step7:0};
  const val = n => ({
    1: (r ? r.waiting : 0) + ' queued',
    2: f.ideas + ' built',
    3: f.step3_pass + ' pass',
    // ONE IDEA SENT TO REPAIR COUNTS ONCE, however many tweaks it got.
    // Kris, 2026-09-24: "0 / 8 fixed" was unreadable - he wants "1k tested,
    // 450 sent to repair, N of those worked". Attempts are not the unit.
    4: (() => {
      const sent = (r ? r.ideas : []).filter(x => (x.repairs || []).length).length;
      return `${sent} repaired · ${f.step4_repaired} fixed`;
    })(),
    5: (r && r.step5) ? (r.step5.real > r.step5.null_max ? 'not luck' : 'could be luck') : '—',
    6: f.step6_pass + ' held',
    7: f.step7 + ' scored',
  })[n];
  $('line').innerHTML = S.steps.map(s => {
    const on = cur === s.n, done = cur > s.n;
    const pct = on && b.total ? Math.round(100*b.done/b.total) : (done?100:0);
    const v = String(val(s.n));
    const zero = /^(0|—|p —)\b/.test(v);
    return `<div class="station ${on?'active':done?'done':''}">
      <div class="n mono">STEP ${s.n}</div>
      <div class="nm">${esc(s.name)}</div>
      <div class="d">${esc(s.detail)}</div>
      <div class="v mono ${zero?'zero':(v==='could be luck'?'mid':(s.n>=3?'good':''))}">${s.n === 4
        ? v.replace(/^(\d+) repaired · (\d+) fixed$/, (_, a, b) =>
            `<span class="${+a ? 'mid' : 'dim'}">${a} repaired</span>`
            + `<span class="${+b ? 'ok' : 'dim'}" style="display:block;font-size:13px">${b} of them fixed</span>`)
        : esc(v)}</div>
      <i class="bar" style="width:${pct}%"></i></div>`;
  }).join('');
}

function now(){
  const b = S.beat;
  if (!S.live){
    $('nowStep').textContent = 'Idle';
    $('nowDetail').textContent = 'No pass has reported in the last hour.';
    $('nowIdea').textContent = 'Start one with  python -m factory.nightly';
    $('nowAge').textContent = '';
    return;
  }
  $('nowStep').textContent = b.step ? `Step ${b.step} — ${b.label}` : b.label;
  $('nowDetail').textContent = b.detail || '';
  $('nowIdea').textContent = [b.idea, b.cell,
    b.total ? `${b.done}/${b.total}` : ''].filter(Boolean).join('   ·   ');
  // HOW OLD THE LAST BEAT IS. A pass that was killed keeps the "running" dot
  // until the stale timer expires an hour later, which would read as a factory
  // working on nothing. The age is the one number that gives that away, so it
  // is on the page rather than inferred.
  const age = Math.max(0, S.now - b.updated);
  $('nowAge').textContent = age < 15 ? 'updated just now'
    : `last update ${dur(age)} ago` + (age > 120 ? '  —  the pass may have stopped' : '');
  $('nowAge').style.color = age > 120 ? 'var(--warn)' : '';
}

function funnel(){
  const r = row();
  const f = r ? r.funnel : S.funnel, max = Math.max(f.ideas, 1);
  const rows = [['tested', f.ideas], ['passed 3 years', f.step3_pass],
                ['fixed by repair', f.step4_repaired],
                ['passed older years', f.step6_pass], ['scored', f.step7]];
  $('funnel').innerHTML = rows.map(([k,v]) =>
    `<div class="frow"><span class="k">${k}</span>
       <span class="t"><i style="width:${Math.max(2, 100*v/max)}%"></i></span>
       <span class="v mono">${v}</span></div>`).join('');
}

function gates(){
  const r = row();
  const g = r ? r.stopped : {}, tot = Object.values(g).reduce((a,b)=>a+b,0);
  $('gatesCard').style.display = tot ? '' : 'none';
  // Cleared even when hidden: a stale lede from the previous source is one
  // browser-inspector away from being read as this source's number.
  if (!tot){ $('gatesLede').textContent = ''; $('gatesTable').innerHTML = '';
             $('gatesNote').textContent = ''; return; }
  // ONE IDEA IS NOT ONE TEST. Every idea is run on 24 cells - six markets by
  // four timeframes - so a single script produces up to 24 rows here. Kris saw
  // 46 from one script (a double-count, since fixed) and had no way to tell
  // whether 24 was even the right order of magnitude.
  // ONE ROW PER IDEA, not per cell-test. An idea is run on 24 cells and only
  // its FURTHEST outcome is a fact about the idea; counting cells here is what
  // made a single script look like 46 tests.
  $('gatesLede').textContent = `${tot} idea${tot===1?'':'s'} · each tested on 6 markets × 4 timeframes`;
  const nice = k => STOP_WHY[k] ? STOP_WHY[k][1] : String(k).split(':').pop();
  $('gates').innerHTML = Object.entries(g).filter(([,v])=>v)
    .map(([k,v]) => `<i style="width:${100*v/tot}%;background:${STOP_COL(k)}"></i>`).join('');
  $('gatesLegend').innerHTML = Object.entries(g).filter(([,v])=>v)
    .map(([k,v]) => `<span><i class="sw" style="background:${STOP_COL(k)}"></i>
       ${esc(nice(k))} ${Math.round(100*v/tot)}%</span>`).join('');
  $('gatesTable').innerHTML =
    `<tr><th>stopped at</th><th>reason</th><th style="text-align:right">ideas</th>
      <th style="text-align:right">share</th></tr>` +
    Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([k,v]) => {
      const [step, why, means] = STOP_WHY[k] || ['—', k, ''];
      return `<tr><td><span style="display:inline-flex;align-items:center;gap:7px">
          <i class="sw" style="background:${STOP_COL(k)}"></i>${esc(step)}</span></td>
        <td class="wide">${esc(why)}
          ${means ? `<div class="means">${esc(means)}</div>` : ''}</td>
        <td class="mono ${k==='scored'?'good':'bad'}" style="text-align:right">${v}</td>
        <td class="mono dim" style="text-align:right">${Math.round(100*v/tot)}%</td></tr>`;
    }).join('');
  const t = (g['3:trades'] || 0) + (g['6:trades'] || 0);
  $('gatesNote').textContent = '';
}

function nullPanel(){
  const r = row();
  const n = r ? r.step5 : null;
  $('nullCard').style.display = n ? '' : 'none';
  if (!n){ $('null').innerHTML = ''; return; }
  const beat = n.real > n.null_max;
  $('null').innerHTML =
    `<table>
      <tr><td class="muted">passed on real prices</td><td class="mono" style="text-align:right">${n.real}</td></tr>
      <tr><td class="muted">passed on random prices (avg)</td><td class="mono" style="text-align:right">${n.null_mean}</td></tr>
      <tr><td class="muted">passed on random prices (best)</td><td class="mono" style="text-align:right">${n.null_max}</td></tr>
     </table>
     <div class="verdict ${beat ? 'ok' : 'bad'}">${beat
       ? 'Real beats random. Not luck.'
       : 'Random did as well. Could be luck.'}</div>`;
}

const nice2 = k => STOP_WHY[k] ? STOP_WHY[k][1] : String(k).split(':').pop();

function srcTable(){
  const rows = S.sources || [];
  $('srcTable').innerHTML =
    `<tr><th>source</th><th>how ideas arrive</th><th>read</th><th>usable</th>
       <th>refused</th><th>tested</th><th>passed 3</th><th>held 6</th>
       <th>scored 7</th><th>failed</th><th>died on</th><th>waiting</th></tr>` +
    rows.map(r => {
      // `stopped`, not `gates`: gates is step-3 only, so an idea that passed
      // step 3 and died on the holdout showed a dash in this column.
      const fails = Object.entries(r.stopped || {})
        .filter(([k]) => k !== 'scored' && k !== 'alive')
        .sort((a,b)=>b[1]-a[1]);
      const top = fails[0];
      return `<tr style="${r.key===SRC?'background:#1b1e23':''}">
        <td><span class="t" style="display:inline-flex;align-items:center;gap:7px">
            <i class="pill ${esc(r.status)}"></i>${esc(r.label)}</span></td>
        <td class="wide dim">${esc(r.how)}</td>
        <td class="mono">${r.read}</td>
        <td class="mono ${r.found?'good':''}">${r.found}</td>
        <td class="mono ${r.refused?'warn':''}">${r.refused}</td>
        <td class="mono">${r.tested}</td>
        <td class="mono ${r.passed3?'good':''}">${r.passed3}</td>
        <td class="mono ${r.held6?'good':''}">${r.held6}</td>
        <td class="mono ${r.scored7?'good':''}">${r.scored7}</td>
        <td class="mono ${r.failed?'bad':''}">${r.failed}</td>
        <td class="dim">${top ? esc(nice2(top[0])) + ' ' + top[1] : '—'}</td>
        <td class="mono">${r.waiting}</td></tr>`;
    }).join('');

  const ready = rows.filter(r => r.status !== 'ready' && r.found === 0);
  $('sourceNote').textContent = '';
}

const OPEN = new Set();
const num = (v, d=3) => (v === null || v === undefined || Number.isNaN(v))
  ? '<span class="dim">—</span>' : `<span class="mono">${Number(v).toFixed(d)}</span>`;

function ideaDetail(x){
  const cells = (x.cells || []).slice()
    .sort((a,b) => (a.verdict === 'PASS' ? -1 : 0) - (b.verdict === 'PASS' ? -1 : 0)
                   || (b.mean_r ?? -9) - (a.mean_r ?? -9));
  const cellRows = cells.map(c => `<tr>
      <td class="mono">${esc(c.cell)}</td>
      <td class="${c.verdict==='PASS'?'pass':'fail'}">${esc(c.verdict)}</td>
      <td class="mono">${c.trades}</td>
      <td class="mono">${Number(c.per_day).toFixed(2)}</td>
      <td>${num(c.mean_r)}</td><td>${num(c.drop_best)}</td><td>${num(c.control_p90)}</td>
      <td class="wide dim">${esc((c.reasons||[]).join('; ') || '—')}
        ${(c.flags||[]).length ? '<span class="flagdot"> ⚑ '
          + esc(c.flags.join('; ')) + '</span>' : ''}</td></tr>`).join('');

  const reps = x.repairs || [];
  const repRows = reps.map(r => `<tr>
      <td class="mono">step ${r.step}</td>
      <td>${esc(r.name)}</td>
      <td class="${r.verdict==='PASS'?'pass':'fail'}">${esc(r.verdict)}</td>
      <td class="wide dim">${esc((r.reasons||[]).join('; ') || '—')}</td></tr>`).join('');

  const hold = x.holdout ? `<h3>Older 2 years</h3>
    <table><tr><th>cell</th><th>verdict</th><th>trades</th><th>/day</th>
      <th>R/trade</th><th>without best 5</th><th>random got</th><th>why</th></tr>
      <tr><td class="mono">${esc(x.holdout.cell)}</td>
        <td class="${x.holdout.verdict==='PASS'?'pass':'fail'}">${esc(x.holdout.verdict)}</td>
        <td class="mono">${x.holdout.trades}</td>
        <td class="mono">${Number(x.holdout.per_day).toFixed(2)}</td>
        <td>${num(x.holdout.mean_r)}</td><td>${num(x.holdout.drop_best)}</td>
        <td>${num(x.holdout.control_p90)}</td>
        <td class="wide dim">${esc((x.holdout.reasons||[]).join('; ')||'—')}</td></tr>
    </table>` : '';

  // THE TWO WINDOWS SIDE BY SIDE. Kris, 2026-09-23: *"so it earned money on
  // some years but on others lost?"* That is exactly the finding, and it was
  // buried in two tables forty rows apart. Put next to each other it needs no
  // explanation at all.
  // `x.cell` is where the step-3 verdict landed; the SCORED cell is
  // `x.score.cell` and they are not always the same, so both the marker
  // and the two-window block have to follow the scorecard.
  const shown = (x.score || {}).cell;
  // Same cell on both rows: the older-years test ran on x.holdout.cell, and
  // pairing it with the headline cell compared 1h recent against 4h older.
  const best = (x.cells || []).find(c => x.holdout && c.cell === x.holdout.cell)
            || (x.cells || []).find(c => c.cell === shown)
            || (x.cells || []).find(c => c.cell === x.cell);
  const cmp = (best && x.holdout) ? `
    <h3>Recent vs older years</h3>
    <div class="scroll"><table>
      <tr><th>years · ${esc(best.cell)}</th><th>what they are</th><th>trades</th><th>per trade</th>
        <th>random got</th><th>verdict</th></tr>
      <tr><td class="mono">2023 – 2026</td>
        <td class="wide dim">tested on</td>
        <td class="mono">${best.trades}</td>
        <td class="mono ${(best.mean_r||0)>0?'good':'bad'}">${num(best.mean_r)}</td>
        <td>${num(best.control_p90)}</td>
        <td class="${best.verdict==='PASS'?'pass':'fail'}">${esc(best.verdict)}</td></tr>
      <tr><td class="mono">2021 – 2023</td>
        <td class="wide dim">hidden check</td>
        <td class="mono">${x.holdout.trades}</td>
        <td class="mono ${(x.holdout.mean_r||0)>0?'good':'bad'}">${num(x.holdout.mean_r)}</td>
        <td>${num(x.holdout.control_p90)}</td>
        <td class="${x.holdout.verdict==='PASS'?'pass':'fail'}">${esc(x.holdout.verdict)}</td></tr>
    </table></div>
` : '';

  // THE TIMEFRAME TRADE-OFF. Slower charts earn more per trade and take far
  // longer to resolve an evaluation. One headline number hides that; the
  // ladder is the choice Kris actually has to make.
  const lad = (x.ladder || []);
  const ladder = lad.length > 1 ? `
    <h3>By timeframe</h3>
    <div class="scroll"><table>
      <tr><th>timeframe</th><th>trades</th><th>trades / day</th><th>PF</th>
        <th>R / trade</th><th>max DD</th><th>pass %</th><th>eval days</th>
        </tr>
      ${lad.map(k => `<tr${k.cell === shown ? ' style="background:#1b1e23"' : ''}>
        <td class="mono">${esc(k.tf)}${k.cell === shown ? '  ◂' : ''}</td>
        <td class="mono">${k.trades}</td>
        <td class="mono">${Number(k.per_day).toFixed(2)}</td>
        <td class="mono ${(k.pf||0) >= 1.2 ? 'good' : 'bad'}">${k.pf == null ? '—' : k.pf.toFixed(2)}</td>
        <td class="mono ${(k.mean_r||0) > 0 ? 'good' : 'bad'}">${Number(k.mean_r).toFixed(3)}</td>
        <td class="mono">${k.max_dd_r}R</td>
        <td class="mono">${k.pass_pct ?? '—'}</td>
        <td class="mono">${k.eval_days ?? '—'}</td>
        </tr>`).join('')}
    </table></div>
` : '';

  return `<div class="det">
    <p class="why mono">${esc(x.idea)}</p>
    ${ladder}
    <p class="why">stop ${x.stop_atr} ATR · target ${x.target_atr} ATR ·
       max hold ${x.max_hold} bars</p>
    ${cmp}
    <h3>All 24 markets × timeframes</h3>
    <div class="scroll"><table>
      <tr><th>cell</th><th>verdict</th><th>trades</th><th>/day</th><th>mean R</th>
        <th>without best 5</th><th>random got</th><th>why</th></tr>${cellRows}</table></div>
    ${hold}
    <h3>Repairs · ${reps.length} tried · ${reps.filter(r => r.verdict==='PASS').length} worked</h3>
    ${reps.length
      ? `<div class="scroll"><table><tr><th>at</th><th>change</th><th>verdict</th>
           <th>why</th></tr>${repRows}</table></div>`
      : '<p class="why">None — not close enough.</p>'}
  </div>`;
}

// "Boxes PRO - Dual %R Overbought Box (Long)" -> "Boxes PRO · long".
// Enumerated ideas have no script name; their rule IS the name.
const shortName = x => {
  if (!x.name || x.name.includes(' when ') || x.name === x.idea) return x.idea;
  const [head, tail = ''] = x.name.split(' - ');
  // A short tail is a variant ("long 120"); a long one is a description.
  return tail && tail.length <= 12 ? `${head} · ${tail}`
       : `${head.replace(/\s*\[.*$/, '')}${x.side ? ' · ' + x.side : ''}`;
};
const plainOutcome = o => {
  o = o || '';
  const m = o.match(/step (\d)/);
  if (/scored|held/.test(o)) return 'passed';
  if (/repaired/.test(o)) return `fixed · step ${m ? m[1] : '?'}`;
  if (/passed step 3/.test(o)) return 'waiting';
  return m ? `died · step ${m[1]}` : (o || '—');
};

function ideasTable(){
  const r = row();
  const list = r ? r.ideas : [];
  $('ideasCard').style.display = list.length ? '' : 'none';
  if (!list.length) return;
  $('ideas').innerHTML =
    `<tr><th>strategy</th><th>market</th><th>tf</th><th>trades/day</th>
       <th>PF</th><th>win %</th><th>R/trade</th><th>max DD</th>
       <th>pass %</th><th>days</th><th>result</th><th>repairs</th></tr>` +
    list.map((x, i) => {
      const good = /passed|held|scored|repaired/.test(x.outcome || '');
      const open = OPEN.has(i);
      const k = x.score || {};
      const pf = k.pf;
      return `<tr class="idea ${open?'open':''}" data-i="${i}">
          <td class="wide">${esc(shortName(x))}</td>
          <td class="mono">${esc(k.market || '—')}</td>
          <td class="mono">${esc(k.tf || '—')}</td>
          <td class="mono">${k.per_day == null ? '—' : k.per_day.toFixed(2)}</td>
          <td class="mono ${pf == null ? '' : (pf >= 1.2 ? 'good' : 'bad')}">
            ${pf == null ? '—' : pf.toFixed(2)}</td>
          <td class="mono">${k.win_pct ?? '—'}</td>
          <td class="mono ${(k.mean_r ?? 0) > 0 ? 'good' : 'bad'}">
            ${k.mean_r == null ? '—' : k.mean_r.toFixed(2)}</td>
          <td class="mono">${k.max_dd_r == null ? '—' : k.max_dd_r + 'R'}</td>
          <td class="mono">${k.pass_pct ?? '—'}</td>
          <td class="mono">${k.eval_days ?? '—'}</td>
          <td class="${good?'good':'bad'}">${esc(plainOutcome(x.outcome))}</td>
          <td class="mono">${(x.repairs||[]).length}</td>
        </tr>` + (open ? `<tr class="detail"><td colspan="12">${ideaDetail(x)}</td></tr>` : '');
    }).join('');
  $('ideas').querySelectorAll('tr.idea').forEach(tr => tr.onclick = () => {
    const i = Number(tr.dataset.i);
    OPEN.has(i) ? OPEN.delete(i) : OPEN.add(i);
    ideasTable();
  });
}

function gapsTable(){
  const g = (S.gaps || []).filter(x => !SRC || x.source === SRC);
  $('gapsCard').style.display = g.length ? '' : 'none';
  if (!g.length) return;
  $('gapsTable').innerHTML =
    `<tr><th>script</th><th>what is missing</th></tr>` +
    g.map(x => `<tr><td class="mono">${esc(x.script)}</td>
      <td class="wide dim">${esc(String(x.why).replace(/^grammar gap:\s*/,''))}</td></tr>`).join('');
}

function queueTable(){
  const by = S.queue.waiting_by_source || {};
  const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('queue').innerHTML = `<tr><th>source</th><th style="text-align:right">waiting</th></tr>` +
    (rows.length ? rows.map(([k,v]) =>
      `<tr><td><span class="tag ${esc(k)}">${esc(k)}</span></td>
        <td class="mono" style="text-align:right">${v}</td></tr>`).join('')
     : `<tr><td colspan="2" class="empty">queue is empty</td></tr>`) +
    `<tr><td class="dim">already tested</td>
      <td class="mono dim" style="text-align:right">${S.queue.tried}</td></tr>`;
}

function sourceTable(){
  const t = S.by_source, keys = Object.keys(t);
  $('source').innerHTML = `<tr><th>source</th><th>tested</th><th>survived</th><th>rate</th></tr>` +
    (keys.length ? keys.map(k => {
      const r = t[k];
      return `<tr><td><span class="tag ${esc(k)}">${esc(k)}</span></td>
        <td class="mono">${r.tested}</td><td class="mono">${r.survived}</td>
        <td class="mono">${r.rate_pct==null?'—':r.rate_pct+'%'}</td></tr>`;
    }).join('') : `<tr><td colspan="4" class="empty">no passes recorded yet</td></tr>`);
  const a = t.agent, i = t.invent;
  $('sourceNote').textContent = (a && i && a.tested >= 20 && i.tested >= 20)
    ? (a.rate_pct > i.rate_pct
        ? 'The model is surviving at a better rate than the enumerator.'
        : 'The model is not surviving better than the enumerator. It is not earning its tokens yet.')
    : 'Not enough passes to compare — this is the number that decides whether paying for a model is worth it.';
}



function paint(){
  $('dot').className = 'dot' + (S.live ? ' on' : '');
  $('status').textContent = S.live ? 'running' : 'idle';
  $('passes').textContent = S.passes + (S.passes === 1 ? ' pass' : ' passes');
  sourceBar(); stations(); now(); funnel(); gates(); nullPanel();
  ideasTable(); gapsTable(); srcTable();
}

async function pull(){
  try{
    const r = await fetch('/api/state', {cache:'no-store'});
    S = await r.json(); tick = 0; paint();
  }catch(e){
    $('status').textContent = 'server unreachable';
    $('dot').className = 'dot';
  }
}
// The uptime reads as a clock, so it ticks locally between polls instead of
// jumping in two-second steps.
setInterval(() => {
  if (!S) return;
  $('uptime').textContent = S.live ? dur(S.uptime_s + (++tick)) : 'not running';
  $('uptimeLabel').textContent = S.live
    ? 'running without interruption' : 'nothing on the line right now';
}, 1000);
pull(); setInterval(pull, 2000);
</script>
</body>
</html>
