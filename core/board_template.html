<meta charset="utf-8">
<title>Hypothesis board</title>
<!-- The charset is not optional: this page is opened over file://, where a
     browser has no HTTP header to read it from and falls back to a legacy
     encoding. Every em dash on the board rendered as "â€"" until 2026-09-09. -->
<!-- The page is a static file opened over file://, so an already-open tab keeps
     showing whatever was rendered when it was opened. The auto-refresh that used
     to cover that was removed on Kris's instruction 2026-09-08 - it stole focus
     and scroll position mid-read. The build time in the header is now the only
     thing that tells you which render you are looking at, so CHECK IT, and
     reload by hand after a rebuild. -->
<style>
:root{
  --bg:#faf9f7; --surface:#fff; --ink:#16150f; --muted:#6b6862; --line:#e3e0d8;
  --good:#1a7f4b; --warn:#a8730a; --fail:#b3261e; --accent:#2b5fd9;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14140f; --surface:#1c1c17; --ink:#f0eee6; --muted:#96938b; --line:#2e2e27;
  --good:#4ec27f; --warn:#d99b25; --fail:#f0705f; --accent:#7aa2f7;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#14140f; --surface:#1c1c17; --ink:#f0eee6; --muted:#96938b; --line:#2e2e27;
  --good:#4ec27f; --warn:#d99b25; --fail:#f0705f; --accent:#7aa2f7;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  margin:0;padding:0 20px 60px}
/* Wide enough that sixteen columns fit without a horizontal scrollbar on a
   normal screen. The table is the page; it should not be squeezed into a
   reading-width column and then scrolled sideways. */
.wrap{max-width:1760px;margin:0 auto}
header{padding:30px 0 16px;border-bottom:1px solid var(--line);margin-bottom:22px}
h1{margin:0;font-size:20px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.built{color:var(--muted);font-size:11px;margin-top:6px;opacity:.75;
  font-family:"JetBrains Mono",ui-monospace,monospace}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 6px}
.riskbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 10px}
.riskbar .lab{font-size:12px;color:var(--muted);margin-right:4px}
.rb{background:var(--surface);color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;
  font-family:"JetBrains Mono",ui-monospace,monospace}
.rb:hover{color:var(--ink)}
.rb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rb.auto::after{content:"\2713";margin-left:5px;opacity:.7}
.risknote{color:var(--muted);font-size:12px;margin:14px 0 10px;line-height:1.55}
.running{background:var(--surface);border:1px solid var(--accent);border-radius:5px;
  padding:9px 13px;margin:14px 0 4px;font-size:12.5px;color:var(--accent);
  display:flex;align-items:center;gap:9px}
.running .bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.running .bar i{display:block;height:100%;background:var(--accent)}
.running b{font-family:"JetBrains Mono",ui-monospace,monospace}
.risksel{background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:2px 4px;font-size:12px;cursor:pointer;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums}
.risksel:hover{border-color:var(--accent)}
.risksel.forced{border-color:var(--accent);color:var(--accent)}
.tab{background:var(--surface);color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:7px 15px;font-size:13px;cursor:pointer;
  font-family:inherit;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .hid{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;opacity:.75}
h2{font-size:17px;margin:24px 0 3px;letter-spacing:-.01em}
.tagline{color:var(--muted);font-size:13px;margin:0 0 4px}
.meta{color:var(--muted);font-size:12px;margin:0 0 16px;
  font-family:"JetBrains Mono",ui-monospace,monospace}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px;table-layout:auto}
th,td{padding:10px 10px;text-align:right;border-bottom:1px solid var(--line);
  white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
  font-weight:600;background:var(--bg);position:sticky;top:0}
/* the two leading text columns can breathe; every number column stays tight */
th:first-child,td:first-child{padding-left:15px}
th:last-child,td:last-child{padding-right:15px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.cls{font-weight:700}
.mkt{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
.mode{font-size:11px;color:var(--muted)}
.mode.bk{color:var(--accent);font-weight:600}
/* a basket row sits under its class's single-market row; the tint groups them */

.good{color:var(--good)} .warn{color:var(--warn)} .fail{color:var(--fail)}
.dim{color:var(--muted)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px}
.pill{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);margin-left:5px;
  font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.02em}
.pill.no{color:var(--fail);border-color:var(--fail)}
.foot{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:40px;margin-top:24px;box-shadow:var(--shadow);max-width:720px}
.empty h2{margin:0 0 8px}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:12px}
details table{margin-top:8px;font-size:12px}
.notes{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:12.5px;
  line-height:1.65;max-width:1000px}
.notes li{margin-bottom:5px}
.notes b{color:var(--ink)}
/* THE BAND. Printed under every number the board ranks on, in the same cell,
   because a band that lives in a tooltip gets read by nobody. */
.band{display:block;font-size:10px;color:var(--muted);opacity:.85;
  font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400;
  letter-spacing:-.01em}
.tier{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:3px;
  border:1px solid var(--line);color:var(--muted);
  font-family:"JetBrains Mono",ui-monospace,monospace}
.tier.t1{border-color:var(--accent);color:var(--accent)}
.floorline{background:var(--surface);border:1px solid var(--warn);border-radius:5px;
  padding:9px 13px;margin:14px 0 2px;font-size:12.5px;color:var(--muted);
  line-height:1.55;max-width:1100px}
.floorline b{color:var(--warn)}
.pinebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 2px}
.pinebtn{background:var(--accent);color:#fff;border:1px solid var(--accent);
  border-radius:5px;padding:7px 13px;font-size:12.5px;cursor:pointer;
  font-family:inherit;font-weight:600}
.pinebtn:hover{filter:brightness(1.08)}
.pinebtn.done{background:var(--good);border-color:var(--good)}
.pinesrc{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}
pre.pine{background:var(--bg);border:1px solid var(--line);border-radius:5px;
  padding:12px;overflow:auto;max-height:420px;font-size:11.5px;line-height:1.5;
  font-family:"JetBrains Mono",ui-monospace,monospace;white-space:pre}
</style>

<div class="wrap">
  <header>
    <h1>Hypothesis board</h1>
    <div class="sub" id="firm"></div>
    <div class="built" id="built"></div>
    <div class="floorline" id="floor"></div>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="panel"></div>
</div>

<script>
// The build step replaces the whole token below with the real payload. It used
// to be `/*__DATA__*/ {...default...}`, which left the default object sitting
// next to the injected one - two expressions juxtaposed, a syntax error, and a
// page that rendered its header and nothing else. There is exactly one value here.
const D = __BOARD_DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = (v, d = 2) => (v === null || v === undefined || Number.isNaN(v))
  ? '<span class="dim">—</span>' : Number(v).toFixed(d);

$('built').textContent = D.built
  ? `built ${D.built} · reload the page by hand to pick up a rebuild`
  : '';

const F = D.firm || {};
$('firm').textContent =
  `${F.name || 'the firm'} · make ${(F.target*100||0).toFixed(0)}% · `
  + `lose ${(F.daily*100||0).toFixed(0)}% in a day or `
  + `${(F.maxloss*100||0).toFixed(0)}% total and you are out · goal: pass in 5–14 days`;

// THE NOISE FLOOR AND THE BANDS.
//
// Measured 2026-09-08: six gates carrying no information by construction scored
// between 13.3 and 26.5 expected days through this same machine. Every real
// candidate that day landed inside that spread, and so did the 62.6%-pass
// headline of the day before, which evaporated when the grid was widened.
//
// So no number on this page is quoted alone any more. Under each ranked number
// is the 10th-90th percentile of a block bootstrap of that cell's own daily
// returns (core/noiseband.py), and rows whose bands overlap carry the same TIER
// and are not claimed to differ.
const NF = D.noise_floor || {};
$('floor').innerHTML = NF.days
  ? `<b>Luck zone: ${NF.days[0]}\u2013${NF.days[1]} days.</b>
     A strategy that knows nothing scored in here, so anything in this range may be luck.
     <br>Small grey numbers = the range a figure could really be.
     Same <span class="tier">T1</span> tier = too close to call.`
  : '';

function bandTxt(b, f){
  if (!b) return '<span class="band dim" title="not measured on this record - rerun the hypothesis to add one">no band</span>';
  const lo = b[f+'_lo'], hi = b[f+'_hi'];
  if (lo == null || hi == null)
    return `<span class="band dim" title="${b.never_pct}% of resamples never funded an account">unfundable</span>`;
  const t = `${b.resamples} stationary-bootstrap resamples, mean block ${b.mean_block} days`
    + (b.never_pct ? `; ${b.never_pct}% of resamples never funded an account` : '');
  return `<span class="band" title="${t}">${Number(lo).toFixed(1)}\u2013${Number(hi).toFixed(1)}</span>`;
}
function tierChip(t){
  // No chip where there is no number to rank. Stamping T1..T8 down a column of
  // "never" reads as a ranking of things that were never compared.
  return t == null ? '<span class="dim">—</span>'
                   : `<span class="tier ${t === 1 ? 't1' : ''}">T${t}</span>`;
}
function inFloor(d){
  return NF.days && d != null && d >= NF.days[0] && d <= NF.days[1];
}

// Days to pass IS the phase gate, so it is the column that gets coloured.
function daysClass(d){
  if (d === null || d === undefined) return 'dim';
  if (d <= 14) return 'good';
  if (d <= 50) return 'warn';
  return 'fail';
}

const COLS = [
  {h:'Class',    f:r => `<span class="cls">${esc(r.asset_class)}</span>`},
  {h:'Market',   f:r => r.sym
      ? `<span class="mkt" title="${esc(r.rule ? 'selection rule: ' + r.rule : '')}">${esc(r.sym)} ${esc(r.tf || '')}</span>`
      : `<span class="dim">${esc(r.note || 'none resolved')}</span>`},
  {h:'Days to pass', f:r => r.days_to_pass == null ? '<span class="dim">—</span>'
      : `<b class="${daysClass(r.days_to_pass)}"
           title="${inFloor(r.days_to_pass) ? 'inside the measured noise floor' : ''}"
           >${Number(r.days_to_pass).toFixed(1)}</b>${inFloor(r.days_to_pass) ? '<span class="pill">noise floor</span>' : ''}
         ${bandTxt(r.band, 'days')}`},
  {h:'Pass %',   f:r => `${n(r.pass_pct, 1)}${r.band ? bandTxt(r.band, 'pass') : ''}`},
  // THE GOAL COLUMNS. Kris's target is a PAIR - 60% pass AND 14 days - and
  // neither number alone answers it: a row can pass 79% of the time in 32 days,
  // or resolve in 8 days and pass 40%. `Days` above is the AUTO-picked level,
  // which answers a different question (the fastest whose drawdown fits the cap).
  // These scan the whole stored ladder for the fastest level that actually
  // reaches 60% pass.
  {h:'60% pass in',   f:r => { const b = fastest60(r);
      return b == null ? '<span class="dim">never</span>'
        : `<b class="${b.days_to_pass <= 14 ? 'good' : (b.days_to_pass <= 30 ? 'warn' : 'fail')}"
             title="${b.pass_pct}% pass at ${b.risk_pct}% risk, curve DD ${b.max_dd_pct}%, blown ${(b.fail_max_pct+b.fail_daily_pct).toFixed(1)}%"
             >${Number(b.days_to_pass).toFixed(1)}</b>
           ${bandTxt(b.band, 'days')}`; }},
  {h:'at risk',   f:r => { const b = fastest60(r);
      return b == null ? '<span class="dim">—</span>'
        : `<span class="mono dim">${b.risk_pct.toFixed(2)}%</span>`; }},
  // What happened to the accounts. These three plus 'never resolved' sum to
  // 100%, which is the whole story of an evaluation and was previously invisible:
  // the board showed pass% and a curve drawdown and left the reader to guess why
  // the pass rate was low.
  {h:'Blown %',  f:r => (r.fail_max_pct == null && r.fail_daily_pct == null)
      ? '<span class="dim">—</span>'
      : (() => { const b = (r.fail_max_pct||0) + (r.fail_daily_pct||0);
                 return `<span class="${b > 20 ? 'fail' : (b > 5 ? 'warn' : '')}"
                   title="max-DD ${n(r.fail_max_pct,1)}% + daily ${n(r.fail_daily_pct,1)}%"
                   >${b.toFixed(1)}</span>`; })()},
  {h:'Never finished %', f:r => { const v = stalled(r);
      return v == null ? '<span class="dim">—</span>'
        : `<span class="${v > 50 ? 'fail' : (v > 25 ? 'warn' : '')}"
            title="never reached the 6% target inside 400 days">${n(v,1)}</span>`; }},
  {h:'Curve drop %', f:r => r.max_dd_pct == null ? '<span class="dim">—</span>'
      : `<span class="dim" title="peak-to-trough of the strategy's whole 3-year equity curve at this risk. NOT one account's drawdown - an account lives weeks, not years, and never meets the whole curve. The blown % column is the account-level number.">${n(r.max_dd_pct,2)}</span>`},
  {h:'Profit factor',       f:r => r.pf == null ? '<span class="dim">—</span>'
      : `<span class="${r.pf >= 1.2 ? 'good' : (r.pf >= 1 ? '' : 'fail')}">${n(r.pf,3)}</span>`},
  {h:'PF at 2x cost', f:r => n(r.pf_2x, 3)},
  {h:'Growth %/yr',   f:r => r.cagr_pct == null ? '<span class="dim">—</span>'
      : `<span class="${r.cagr_pct > 0 ? 'good':'fail'}">${n(r.cagr_pct,1)}</span>`},
  {h:'Win %',    f:r => n(r.win_pct, 1)},
  {h:'Avg R',    f:r => n(r.avg_r, 3)},
  {h:'Trades/day', f:r => n(r.trades_per_day, 2)},
  {h:'Trades',   f:r => r.trades == null ? '<span class="dim">—</span>' : r.trades},
  {h:'Risk/trade',   f:r => riskCell(r)},
  {h:'Sharpe',   f:r => n(r.sharpe, 2)},
  {h:'Cost', f:r => r.cost_rt_bps == null ? '<span class="dim">—</span>'
      : `${n(r.cost_rt_bps,2)}${r.cost_measured ? '' : '<span class="pill">assumed</span>'}`},
  {h:'Beats noise', f:r => r.beats_null === undefined ? '<span class="dim">—</span>'
      : (r.beats_null ? '<span class="good">yes</span>'
                      : '<span class="fail">no</span>')},
];

// Every selection rule for the promoted market, because the headline uses the
// BUSIEST one and that is not the best one. A single configuration and a ten-deep
// book of the same signal are different strategies with different daily-cap
// exposure, and the board was only ever showing the second.
function ruleTable(rows){
  const withRules = rows.filter(r => (r.rules || []).length);
  if (!withRules.length) return '';
  return `<details open><summary>Selection rules on each promoted market &mdash;
      the headline row uses the busiest, which is not the fastest</summary>
    <div class="scroll"><table><thead><tr>
      <th>Market</th><th>Rule</th><th>Trades</th><th>Tr/day</th><th>PF</th>
      <th>Win %</th><th>Avg R</th><th>60% in</th><th>@ risk</th>
      <th>Tier</th></tr></thead><tbody>
      ${withRules.flatMap(r => r.rules.map(x => `<tr>
        <td class="mkt">${esc(r.sym)} ${esc(r.tf)}</td>
        <td class="mono dim">floor ${x.floor} / top ${x.topn}</td>
        <td>${x.trades}</td><td>${n(x.tpd,2)}</td>
        <td class="${x.pf >= 1.2 ? 'good' : ''}">${n(x.pf,3)}</td>
        <td>${n(x.win_pct,1)}</td><td>${n(x.avg_r,3)}</td>
        <td>${x.days60 == null ? '<span class="dim">never</span>'
              : `<b class="${x.days60 <= 14 ? 'good' : (x.days60 <= 30 ? 'warn' : 'fail')}"
                   title="${x.pass60}% pass">${Number(x.days60).toFixed(1)}</b>
                 ${bandTxt(x.band60, 'days')}`}</td>
        <td class="mono dim">${x.risk60 == null ? '—' : x.risk60.toFixed(2) + '%'}</td>
        <td>${tierChip(x.tier60)}</td>
      </tr>`)).join('')}
    </tbody></table></div></details>`;
}

// The per-class "considered" list carries only sym/tf/pf/days - the band and the
// tier live on the full cell record, so they are joined back on here rather than
// duplicated into every row at build time.
function considered(rows, h){
  const byKey = {};
  (h.cells || []).forEach(c => { byKey[`${c.sym}|${c.tf}`] = c; });
  const all = rows.flatMap(r => (r.considered || []).map(c => {
    const thin = typeof c === 'string' ? {sym:c} : c;
    const full = byKey[`${thin.sym}|${thin.tf}`];
    return full ? Object.assign({}, thin, {band: full.band, tier: full.tier}) : thin;
  }));
  if (!all.length) return '';
  return `<details><summary>Every market tested, before the best in each class was promoted</summary>
    <div class="scroll"><table><thead><tr>
      <th>Market</th><th>PF</th><th>Days to pass</th><th>Tier</th></tr></thead><tbody>
      ${all.map(c => `<tr><td class="mkt">${esc(c.sym)} ${esc(c.tf ?? '')}</td>
        <td>${n(c.pf,3)}</td><td>${c.days_to_pass == null ? '<span class="dim">—</span>'
          : `<span class="${daysClass(c.days_to_pass)}">${Number(c.days_to_pass).toFixed(1)}</span>
             ${bandTxt(c.band, 'days')}`}</td>
        <td>${tierChip(c.tier)}</td></tr>`).join('')}
    </tbody></table></div></details>`;
}

// Every market is trimmed to the same window, so showing it once above the table
// is honest; if they ever diverge the per-row values would have to be shown
// instead, because an unequal window makes the comparison a lie.
function dataSpan(h){
  const c = (h.cells || []).filter(x => x.data_from && x.data_to);
  if (!c.length) return '';
  const from = c.map(x => x.data_from).sort()[0];
  const to = c.map(x => x.data_to).sort().slice(-1)[0];
  return ` (${esc(from)} to ${esc(to)})`;
}

// RISK IS SET PER ROW, not for the whole table. Each asset class is a different
// market with a different drawdown shape, so forcing one level across all three
// compares things nobody would trade together.
//
// Risk per trade is the only lever left once a configuration has been chosen
// blind, and it moves speed and survival in OPPOSITE directions. Profit factor,
// win rate, average R, trades per day and Sharpe are all R-based and do NOT move
// with it - only pass rate, drawdown, days and CAGR do, and only those are
// swapped here.
const ROW_RISK = {};       // asset class -> chosen risk %, or absent for 'auto'

function atRisk(r){
  let want = ROW_RISK[r.asset_class];
  // KRIS, 2026-09-09: "in this table I always want to see the best settings."
  // So a row defaults to the fastest size that gets 60% of accounts through -
  // his stated goal - rather than to the size the risk ladder picks, which
  // answers a different question (the smallest size above the 2% floor that
  // resolves accounts at all). The dropdown still overrides it, and when no
  // size on the row reaches 60% the ladder's own pick stands.
  if (want === undefined){
    const g = fastest60(r);
    if (g) want = g.risk_pct;
  }
  if (want === undefined || !r.ladder) return r;
  const lv = r.ladder.find(x => Math.abs(x.risk_pct - want) < 1e-9);
  if (!lv) return r;
  return Object.assign({}, r, {
    risk_pct: lv.risk_pct, pass_pct: lv.pass_pct, max_dd_pct: lv.max_dd_pct,
    days_to_pass: lv.days_to_pass, median_days: lv.median_days,
    fail_max_pct: lv.fail_max_pct, fail_daily_pct: lv.fail_daily_pct,
    still_open_pct: lv.still_open_pct,
    // the band belongs to the RUNG, so forcing a risk level has to swap it too
    // - otherwise the page would print one level's number under another's band.
    band: lv.band,
    cagr_pct: lv.cagr_pct, _forced: !lv.picked});
}

// The runner records still-open only inside the ladder, so at the auto-picked
// level it has to be read back out of it. Stalled is the quiet killer - accounts
// that never reach the target rather than accounts that die - and a blank column
// hid it completely.
// The fastest risk level that reaches at least 60% pass. Kris's goal is stated
// as a PAIR - 60% pass AND 14 days - and neither number alone answers it: a level
// can pass 79% of the time and take 32 days, or resolve in 8 days and pass 40%.
function fastest60(r){
  const ok = (r.ladder || []).filter(x => x.pass_pct >= 60 && x.days_to_pass);
  if (!ok.length) return null;
  return ok.reduce((a, b) => b.days_to_pass < a.days_to_pass ? b : a);
}

function stalled(r){
  if (r.still_open_pct != null) return r.still_open_pct;
  const lv = (r.ladder || []).find(x => Math.abs(x.risk_pct - r.risk_pct) < 1e-9);
  return lv ? lv.still_open_pct : null;
}

function riskCell(r){
  if (!r.ladder || !r.ladder.length)
    return r.risk_pct == null ? '<span class="dim">—</span>' : n(r.risk_pct, 2);
  const cur = ROW_RISK[r.asset_class];
  const sel = cur === undefined ? r.ladder.find(x => x.picked) : null;
  const val = cur === undefined ? (sel ? sel.risk_pct : r.risk_pct) : cur;
  return `<select class="risksel${r._forced ? ' forced' : ''}"
      data-class="${esc(r.asset_class)}" title="risk per trade for this row only">
      ${r.ladder.map(x => `<option value="${x.risk_pct}"
        ${Math.abs(x.risk_pct - val) < 1e-9 ? 'selected' : ''}>${x.risk_pct.toFixed(2)}%${x.picked ? ' \u2713' : ''}</option>`).join('')}
    </select>`;
}

function wireRiskCells(h){
  [...document.querySelectorAll('.risksel')].forEach(el =>
    el.addEventListener('change', () => {
      ROW_RISK[el.dataset.class] = parseFloat(el.value);
      paint(h);
    }));
  $('risknote').innerHTML =
    'Set <b>risk per trade</b> in the Risk column \u2014 that row only. '
    + 'Bigger risk = fewer days, more blown accounts. '
    + '<span class="dim">Rows start at the fastest size where 60% of accounts pass; '
    + '\u2713 marks the ladder\u2019s own pick. Red drawdown = over the limit.</span>';
}

// A half-filled table is the normal state of a twenty-cell run, and it looked
// identical to a broken one. It does not any more.
function progress(h){
  if (h.complete) return '';
  // cells_done is the RUN's count; h.cells may have been cut by the render
  // filter in core/build_board.SHOW, which is not progress.
  const done = h.cells_done != null ? h.cells_done : (h.cells || []).length;
  const total = Object.values(h.universe || {}).reduce((a, v) => a + v.length, 0)
                * (h.timeframes || []).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  return `<div class="running">
    <span>Running — <b>${done}/${total || '?'}</b> market/timeframe cells done.
      Rows fill in as they finish; reload by hand to see them.</span>
    <span class="bar"><i style="width:${pct}%"></i></span></div>`;
}

// Findings worth carrying on the page rather than in a commit message.
function notes(h){
  if (!h.notes || !h.notes.length) return '';
  return `<details open><summary>What the research established</summary>
    <ul class="notes">${h.notes.map(n => `<li>${n}</li>`).join('')}</ul></details>`;
}

// THE PINE BUTTON. Kris's request, 2026-09-09: one click, paste into
// TradingView, look at the rule on a chart. It copies an INDICATOR - signals and
// the stop level, no orders and no equity curve - because a Pine STRATEGY would
// print a profit factor that somebody would then compare with this board's, and
// the two are not comparable: another vendor's volume on a volume-weighted rule,
// different fills, no costs, and no blind re-selection. See core/pine.py.
//
// The copy goes through a hidden textarea and execCommand first: this page is
// opened over file:// as often as over http://127.0.0.1, and the async clipboard
// API is refused on file://. The textarea path works in both.
function pineBar(h){
  const p = h.pine;
  if (!p) return `<p class="risknote">No TradingView indicator ships with this
    hypothesis yet — add <span class="mono">strategies/&lt;sid&gt;/indicator.pine</span>
    and it appears here. A generic VWAP script under this name would be read as
    this hypothesis, which is why there is no fallback.</p>`;
  const ps = Object.entries(p.params || {}).map(([k, v]) => `${k.toLowerCase()} ${v}`).join(', ');
  return `<div class="pinebar">
      <button class="pinebtn" id="pinebtn" onclick="copyPine(this)">Copy Pine indicator</button>
      <span class="dim" style="font-size:12px">Paste into TradingView. Shows signals only.
        Settings = what the test picked most often on <b>${esc(p.defaults_from)}</b>${ps ? ' (' + esc(ps) + ')' : ''}.</span>
    </div>
    <textarea class="pinesrc" id="pinesrc" readonly>${esc(p.text)}</textarea>
    <details><summary>Read the Pine source before pasting it</summary>
      <pre class="pine">${esc(p.text)}</pre></details>`;
}

function copyPine(btn){
  const ta = document.getElementById('pinesrc');
  if (!ta) return;
  let ok = false;
  try {
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    ok = document.execCommand('copy');
  } catch (e) { ok = false; }
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(
      () => { btn.textContent = 'Copied ✓'; btn.classList.add('done'); },
      () => { btn.textContent = 'Copy failed — open the source below'; });
    return;
  }
  btn.textContent = ok ? 'Copied ✓ — paste into TradingView’s Pine Editor'
                       : 'Copy failed — open the source below';
  btn.classList.toggle('done', ok);
  setTimeout(() => { btn.textContent = 'Copy Pine indicator';
                     btn.classList.remove('done'); }, 6000);
}

// RESEARCH ARMS. Each study compares variants of THIS hypothesis on identical
// folds and costs. Bands first: two arms whose bands overlap have not been shown
// to differ, so the table marks the baseline and states the overlap rather than
// declaring a winner.
function studies(h){
  const st = h.studies || [];
  if (!st.length) return '';
  return st.map(s => `<details open><summary>${esc(s.title)} — ${esc(s.date)}</summary>
    <p class="risknote" style="max-width:1100px">${s.note}
      <span class="dim mono" style="font-size:11px">${esc(s.source)}</span></p>
    <div class="scroll"><table><thead><tr>
      <th>TF</th><th>Version</th><th>Trades/day</th><th>Win %</th><th>Avg R</th>
      <th>PF at 2x cost</th><th>Days to pass</th><th>Pass %</th>
      <th>Never finished %</th><th>60% pass in</th><th>Beats noise</th>
    </tr></thead><tbody>
      ${s.rows.map(r => `<tr>
        <td class="mkt">${esc(r.tf)}</td>
        <td class="mkt">${esc(r.arm)}${r.baseline ? '<span class="pill">baseline</span>' : ''}</td>
        <td>${n(r.trades_per_day,2)}</td>
        <td>${n(r.win_pct,1)}</td>
        <td>${n(r.avg_r,3)}</td>
        <td class="${r.pf_2x >= 1.2 ? 'good' : (r.pf_2x >= 1 ? '' : 'fail')}">${n(r.pf_2x,3)}</td>
        <td><b class="${daysClass(r.days_to_pass)}">${n(r.days_to_pass,1)}</b>${bandTxt(r.band,'days')}</td>
        <td>${n(r.pass_pct,1)}</td>
        <td class="${r.stalled_pct > 5 ? 'warn' : 'dim'}">${n(r.stalled_pct,1)}</td>
        <td>${r.days60 == null ? '<span class="dim">never</span>'
              : `<b class="${r.days60 <= 14 ? 'good' : (r.days60 <= 35 ? 'warn' : 'fail')}"
                   title="${esc(r.rule60 || '')}">${Number(r.days60).toFixed(1)}</b>
                 ${bandTxt(r.band60, 'days')}
                 <span class="band">${n(r.pass60,1)}% @ ${n(r.risk60,2)}% risk</span>`}</td>
        <td>${r.beats_null ? '<span class="good">yes</span>' : '<span class="fail">no</span>'}</td>
      </tr>`).join('')}
    </tbody></table></div></details>`).join('');
}

function paint(h){
  const _h = h;
  $('panel').innerHTML = `
    <h2>${esc(h.name)}</h2>
    <p class="tagline">${esc(h.tagline || '')}</p>
    <p class="meta">${esc(h.hid)} · ${(h.timeframes||[]).join(' / ')}
      · ${h.years ? h.years + ' years of data' : ''}${dataSpan(h)}
      · limit entry, market exit · walk-forward, config re-chosen blind each quarter</p>
    ${progress(h)}
    <p class="risknote" id="risknote"></p>
    <div class="scroll"><table><thead><tr>
      ${COLS.map(c => `<th>${esc(c.h)}</th>`).join('')}
    </tr></thead><tbody>
      ${(h.rows||[]).map(atRisk).map(r => `<tr>${COLS.map(c => `<td>${c.f(r)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    ${pineBar(h)}
    ${studies(h)}
    ${ruleTable(h.rows || [])}
    ${considered(h.rows || [], h)}
    <p class="foot"><b>Days to pass</b> = days until you hold one funded account,
      counting the accounts that blow up on the way.
      <br><b>60% pass in</b> = the fastest setting where 6 accounts in 10 survive.
      <br><b>Beats noise</b> = the same test on shuffled prices found less. Hover any
      number for the detail.</p>
    ${notes(h)}`;
  wireRiskCells(_h);
}

const H = D.hypotheses || [];
if (!H.length){
  document.querySelector('.wrap').innerHTML +=
    `<div class="empty"><h2>The board is empty.</h2>
     <p>No hypothesis has been run through the pipeline yet.</p></div>`;
} else {
  $('tabs').innerHTML = H.map((h, i) =>
    `<button class="tab" role="tab" aria-selected="${i === 0}">
       <span class="hid">${esc(h.hid)}</span><span>${esc(h.name)}</span></button>`).join('');
  [...document.querySelectorAll('.tab')].forEach((b, i) => b.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', 'false'));
    b.setAttribute('aria-selected', 'true');
    paint(H[i]);
  }));
  paint(H[0]);
}
</script>
